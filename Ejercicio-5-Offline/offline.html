<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12304A">
  <title>Sin conexión | Mi PWA</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand"><span class="brand-mark">PWA</span><span>Mi PWA · Portafolio</span></div>
    </div>
  </header>
  <main>
    <section class="hero">
      <span class="eyebrow">Modo sin conexión</span>
      <h1>No tienes conexión a Internet</h1>
      <p>La página solicitada no está disponible en este momento. Puedes revisar tu conexión e intentar nuevamente. Los recursos guardados en la caché pueden seguir funcionando.</p>
      <button onclick="window.location.reload()">Intentar de nuevo</button>
    </section>
  </main>
  <footer>Esta página de respaldo se guarda en la caché de la PWA.</footer>
</body>
</html>
